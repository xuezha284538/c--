# 基础网络
port = 8080
# 资源根目录：指向 html 资源文件所在路径
root_path = /home/xuezha/c语言/0802/html
max_listen_queue = 1024
# 线程池配置
thread_pool_num = 12
task_queue_max = 1024
# 日志配置（压测时可设 log_enable = 0 降低锁开销）
log_enable = 1
log_file = server.log
log_flush_interval = 500
# 网络超时 毫秒
read_timeout_ms = 3000
write_timeout_ms = 3000
