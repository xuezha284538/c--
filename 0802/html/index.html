    <style>
        /*css 级联样式表 定义样式和布局
        */
        h1
        { 
            text-align: center;
            font-weight:normal;
            color: rgb(3, 0, 10);
            background-color: rgb(255, 255, 255);
        }
        img{
            border-radius: 50px;
            border: 2px solid rgb(0, 255, 242);
        }
        video
        {
            border-radius: 50px;
            border: 3px rgb(255, 106, 0) solid;
        }
 
        /* 每个"图片+文字"或"音频+文字"的组合容器 */
        .item {
            display: flex;/*弹性布局*/
            flex-direction: column;  /* 纵向排列：上面的元素在上，下面的在下 */
            align-items: center;     /* 关键：让文字水平居中对齐到图片正下方 */
            margin: 20px auto;       /* 上下间距 + 整体水平居中 */
        }
    </style>
